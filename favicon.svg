<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700&amp;display=swap');
    </style>
  </defs>
  <!-- Dark pill background -->
  <rect width="32" height="32" rx="8" fill="#0b0b0c"/>
  <!-- Inner ember accent bar at bottom -->
  <rect x="10" y="27" width="12" height="2" rx="1" fill="#ff5a1f"/>
  <!-- "tv" text -->
  <text
    x="16"
    y="21"
    text-anchor="middle"
    font-family="'Inter Tight', Inter, system-ui, sans-serif"
    font-weight="700"
    font-size="14"
    letter-spacing="-0.8"
    fill="#f4f3f0"
  >tv</text>
  <!-- dot -->
  <circle cx="24.5" cy="20" r="1.5" fill="#ff5a1f"/>
</svg>
