<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0b0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="namegrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#6b6b72"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0b0b0c"/>

  <!-- Glow blob -->
  <ellipse cx="1020" cy="126" rx="480" ry="380" fill="url(#glow)"/>

  <!-- Left border accent -->
  <rect x="0" y="0" width="4" height="630" fill="#ff5a1f"/>

  <!-- Logo mark — pill -->
  <rect x="60" y="60" width="72" height="40" rx="20" fill="#f4f3f0"/>
  <text x="96" y="86" text-anchor="middle" font-family="'Inter Tight', Inter, system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="-1" fill="#0b0b0c">tv</text>
  <circle cx="125" cy="83" r="3" fill="#ff5a1f"/>

  <!-- Name -->
  <text x="60" y="290" font-family="'Inter Tight', Inter, system-ui, sans-serif" font-weight="700" font-size="120" letter-spacing="-6" fill="url(#namegrad)">Telvin</text>
  <text x="120" y="420" font-family="'Inter Tight', Inter, system-ui, sans-serif" font-weight="700" font-size="120" letter-spacing="-6" fill="url(#namegrad)">Varfley</text>

  <!-- Tag line -->
  <text x="60" y="490" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" letter-spacing="1" fill="#6b6b72">SOFTWARE ENGINEER · AZURE ARCHITECT · ACCRA, GHANA</text>

  <!-- Divider -->
  <rect x="60" y="510" width="240" height="1" fill="#2a2a2e"/>

  <!-- CTA -->
  <text x="60" y="545" font-family="'Inter Tight', Inter, system-ui, sans-serif" font-weight="500" font-size="22" fill="#f4f3f0">Cloud-native software that real teams </text>
  <text x="60" y="575" font-family="'Inter Tight', Inter, system-ui, sans-serif" font-weight="600" font-size="22" fill="#ff5a1f">actually adopt.</text>

  <!-- Ember dot decoration -->
  <circle cx="1100" cy="580" r="6" fill="#ff5a1f" opacity="0.6"/>
  <circle cx="1130" cy="560" r="3" fill="#ff5a1f" opacity="0.3"/>
  <circle cx="1080" cy="555" r="4" fill="#ff5a1f" opacity="0.2"/>
</svg>
